<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAI-DANG Admin Dashboard - 27 Agent Control Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #94a3b8;
            font-size: 1.2em;
        }

        /* Login Form */
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(30, 41, 59, 0.9);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #3b82f6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .stat-card .icon {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .stat-card .label {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Agent Grid */
        .agents-section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .agents-section h2 {
            margin-bottom: 25px;
            color: #3b82f6;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .agent-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .agent-card:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
        }

        .agent-card.active {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .agent-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .agent-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .agent-specialty {
            font-size: 0.85em;
            color: #94a3b8;
        }

        /* Activity Feed */
        .activity-section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .activity-section h2 {
            margin-bottom: 25px;
            color: #3b82f6;
        }

        .activity-feed {
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .activity-time {
            font-size: 0.8em;
            color: #64748b;
            margin-bottom: 5px;
        }

        .activity-agent {
            font-weight: 600;
            color: #3b82f6;
        }

        .activity-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-left: 8px;
        }

        .activity-type.learning {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .activity-type.scouting {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .activity-type.generating {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }

        /* Refresh Button */
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.4);
            transition: transform 0.3s;
        }

        .refresh-btn:hover {
            transform: rotate(180deg) scale(1.1);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Logout */
        .logout-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="loginContainer" class="login-container">
        <h2>🔐 Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px; color: #64748b; font-size: 0.9em;">
            Default: admin / naidang2025
        </p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="container hidden">
        <div class="header">
            <button class="logout-btn" onclick="logout()">Logout</button>
            <h1>⚡ NAI-DANG Command Center</h1>
            <p class="subtitle">27 AI Agents Working 24/7</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">💰</div>
                <div class="label">Total Revenue</div>
                <div class="value" id="totalRevenue">$0</div>
            </div>
            <div class="stat-card">
                <div class="icon">📦</div>
                <div class="label">Orders</div>
                <div class="value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">🤖</div>
                <div class="label">Active Agents</div>
                <div class="value" id="activeAgents">27</div>
            </div>
            <div class="stat-card">
                <div class="icon">⚡</div>
                <div class="label">Activities Today</div>
                <div class="value" id="activitiesCount">0</div>
            </div>
        </div>

        <!-- Agents -->
        <div class="agents-section">
            <h2>🤖 Agent Swarm</h2>
            <div class="agents-grid" id="agentsGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading agents...</p>
                </div>
            </div>
        </div>

        <!-- Activity Feed -->
        <div class="activity-section">
            <h2>📊 Recent Activity</h2>
            <div class="activity-feed" id="activityFeed">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading activities...</p>
                </div>
            </div>
        </div>

        <!-- Refresh Button -->
        <button class="refresh-btn" onclick="refreshData()" title="Refresh Data">🔄</button>
    </div>

    <script>
        // Auth
        const AUTH_KEY = 'naidang_auth';
        const CREDENTIALS = {
            username: 'admin',
            password: 'naidang2025'
        };

        // Check auth on load
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem(AUTH_KEY) === 'true') {
                showDashboard();
            }
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === CREDENTIALS.username && password === CREDENTIALS.password) {
                localStorage.setItem(AUTH_KEY, 'true');
                showDashboard();
            } else {
                alert('Invalid credentials!');
            }
        });

        function showDashboard() {
            document.getElementById('loginContainer').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadData();
            // Auto-refresh every 30 seconds
            setInterval(loadData, 30000);
        }

        function logout() {
            localStorage.removeItem(AUTH_KEY);
            location.reload();
        }

        // Load data
        async function loadData() {
            await Promise.all([
                loadRevenueData(),
                loadSwarmStatus(),
                loadOrders()
            ]);
        }

        async function loadRevenueData() {
            try {
                const response = await fetch('/api/revenue');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalRevenue').textContent = 
                        `$${data.data.totalRevenue.toLocaleString()}`;
                    document.getElementById('totalOrders').textContent = 
                        data.data.orderCount;
                }
            } catch (error) {
                console.error('Failed to load revenue:', error);
            }
        }

        async function loadSwarmStatus() {
            try {
                const response = await fetch('/api/swarm-status');
                const data = await response.json();
                
                if (data.success) {
                    const swarmData = data.data;
                    
                    // Update stats
                    document.getElementById('activeAgents').textContent = 
                        swarmData.swarmSize;
                    document.getElementById('activitiesCount').textContent = 
                        swarmData.stats.totalActivities;
                    
                    // Render agents
                    renderAgents(swarmData.agents);
                    
                    // Render activities
                    renderActivities(swarmData.recentActivities);
                }
            } catch (error) {
                console.error('Failed to load swarm status:', error);
            }
        }

        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const data = await response.json();
                // Orders loaded, count updated in revenue call
            } catch (error) {
                console.error('Failed to load orders:', error);
            }
        }

        function renderAgents(agents) {
            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = agents.map(agent => `
                <div class="agent-card active">
                    <div class="agent-name">
                        <span class="agent-status"></span>
                        ${agent.name}
                    </div>
                    <div class="agent-specialty">${agent.specialty}</div>
                </div>
            `).join('');
        }

        function renderActivities(activities) {
            const feed = document.getElementById('activityFeed');
            
            if (!activities || activities.length === 0) {
                feed.innerHTML = '<p style="color: #64748b; text-align: center;">No recent activities</p>';
                return;
            }
            
            feed.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-time">${new Date(activity.timestamp).toLocaleTimeString()}</div>
                    <div>
                        <span class="activity-agent">${activity.agent}</span>
                        <span class="activity-type ${activity.activity}">${activity.activity}</span>
                    </div>
                    <div style="margin-top: 8px; color: #cbd5e1; font-size: 0.9em;">
                        ${activity.task || activity.result?.substring(0, 100) || activity.content?.substring(0, 100) || 'Working...'}
                    </div>
                </div>
            `).join('');
        }

        function refreshData() {
            loadData();
            // Rotate button
            const btn = document.querySelector('.refresh-btn');
            btn.style.transform = 'rotate(360deg)';
            setTimeout(() => btn.style.transform = '', 300);
        }
    </script>
</body>
</html>
